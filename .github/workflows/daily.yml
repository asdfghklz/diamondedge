name: DiamondEdge Daily Engine

on:
  schedule:
    - cron: '0 13 * * *'    # 8:00 AM CT  - morning picks
    - cron: '30 17 * * *'   # 12:30 PM CT - lock point (last update, then frozen)
    - cron: '30 23 * * *'   # 6:30 PM CT  - locked pass-through + result checks
    - cron: '0 7 * * *'     # 2:00 AM CT  - results run
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD, blank = today US Central)'
        required: false
        default: ''
      run_type:
        description: 'Run type: full or results'
        required: false
        default: 'full'

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run engine
        env:
          ODDS_API_KEY:    ${{ secrets.ODDS_API_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          TYPE="${{ github.event.inputs.run_type }}"
          HOUR_CT=$(TZ=America/Chicago date +%H)
          if [ -z "$TYPE" ]; then
            if [ "$HOUR_CT" = "02" ]; then TYPE="results"; else TYPE="full"; fi
          fi
          if [ -z "$DATE" ]; then
            if [ "$TYPE" = "results" ]; then
              DATE=$(TZ=America/Chicago date -d "yesterday" +%Y-%m-%d)
            else
              DATE=$(TZ=America/Chicago date +%Y-%m-%d)
            fi
          fi
          echo "Running $TYPE for $DATE (Central hour: $HOUR_CT)"
          python engine/run.py "$DATE" "$TYPE" "$HOUR_CT"

      - name: Commit picks.json
        run: |
          git config user.name "DiamondEdge Bot"
          git config user.email "bot@diamondedge.app"
          git add picks.json
          git diff --cached --quiet || git commit -m "picks: $(date -u +%Y-%m-%d-%H%M)"
          git push
